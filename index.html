<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Киноквиз: Кинематограф России</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0d0f14;
      color: #f4f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 740px;
      background: #171a23;
      border: 1px solid #2b3142;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 560px) {
      .app {
        padding: 20px;
      }
    }

    .tag {
      display: inline-block;
      background: rgba(232, 185, 69, 0.15);
      color: #e8b945;
      border: 1px solid rgba(232, 185, 69, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    h1 span {
      color: #e8b945;
    }

    .desc {
      color: #a0a8b8;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-primary {
      width: 100%;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 700;
      color: #111318;
      background: #e8b945;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover:not(:disabled) {
      background: #f5ca5c;
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: #a0a8b8;
    }

    .top-bar strong {
      color: #e8b945;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #0d0f14;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #e8b945;
      transition: width 0.3s ease;
    }

    .q-era {
      font-size: 13px;
      color: #e8b945;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .q-title {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 20px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: #10131a;
      border: 1px solid #2b3142;
      border-radius: 10px;
      color: #f4f4f6;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.15s, background 0.15s;
    }

    .answer-btn:hover:not(:disabled) {
      border-color: #e8b945;
      background: #1c212e;
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .letter {
      min-width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #232838;
      color: #e8b945;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .answer-btn.is-correct {
      background: rgba(25, 135, 84, 0.25);
      border-color: #2ecc71;
    }

    .answer-btn.is-correct .letter {
      background: #2ecc71;
      color: #0b1911;
    }

    .answer-btn.is-wrong {
      background: rgba(220, 53, 69, 0.25);
      border-color: #ff6b6b;
    }

    .answer-btn.is-wrong .letter {
      background: #ff6b6b;
      color: #1f0a0c;
    }

    .note {
      background: #10131a;
      border-left: 4px solid #e8b945;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
      color: #d6dae3;
    }

    .note-title {
      font-weight: 700;
      color: #e8b945;
      margin-bottom: 4px;
    }

    .score-big {
      font-size: 48px;
      font-weight: 800;
      color: #e8b945;
      text-align: center;
      margin: 12px 0;
    }

    .rank-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .rank-desc {
      text-align: center;
      color: #a0a8b8;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .summary {
      max-height: 260px;
      overflow-y: auto;
      background: #10131a;
      border: 1px solid #2b3142;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 22px;
    }

    .summary-row {
      padding: 10px 0;
      border-bottom: 1px solid #232838;
      font-size: 14px;
      line-height: 1.4;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .ok { color: #2ecc71; font-weight: 700; }
    .err { color: #ff6b6b; font-weight: 700; }
  </style>
</head>
