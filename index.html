<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Киноквиз: Кинематограф России</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0d0f14;
      color: #f4f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: #171a23;
      border: 1px solid #2b3142;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .tag {
      display: inline-block;
      background: rgba(232, 185, 69, 0.15);
      color: #e8b945;
      border: 1px solid rgba(232, 185, 69, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    h1 { font-size: 25px; line-height: 1.25; margin-bottom: 12px; }
    h1 span { color: #e8b945; }
    .desc { color: #a0a8b8; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #111318;
      background: #e8b945;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #a0a8b8;
    }
    .top-bar strong { color: #e8b945; }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #0d0f14;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar { height: 100%; width: 0%; background: #e8b945; transition: width 0.3s; }
    .q-era { font-size: 12px; color: #e8b945; text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
    .q-title { font-size: 19px; font-weight: 700; line-height: 1.35; margin-bottom: 18px; }
    .answers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .answer-btn {
      width: 100%;
      text-align: left;
      padding: 13px 14px;
      background: #10131a;
      border: 1px solid #2b3142;
      border-radius: 10px;
      color: #f4f4f6;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .letter {
      min-width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #232838;
      color: #e8b945;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .answer-btn.ok-ans { background: rgba(25, 135, 84, 0.28); border-color: #2ecc71; }
    .answer-btn.ok-ans .letter { background: #2ecc71; color: #0b1911; }
    .answer-btn.bad-ans { background: rgba(220, 53, 69, 0.28); border-color: #ff6b6b; }
    .answer-btn.bad-ans .letter { background: #ff6b6b; color: #1f0a0c; }
    .note {
      background: #10131a;
      border-left: 4px solid #e8b945;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.45;
      color: #d6dae3;
    }
    .note-title { font-weight: 700; color: #e8b945; margin-bottom: 4px; }
    .score-big { font-size: 44px; font-weight: 800; color: #e8b945; text-align: center; margin: 10px 0; }
    .rank-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .rank-desc { text-align: center; color: #a0a8b8; margin-bottom: 20px; font-size: 14px; }
    .summary {
      max-height: 250px;
      overflow-y: auto;
      background: #10131a;
      border: 1px solid #2b3142;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }
    .summary-row { padding: 8px 0; border-bottom: 1px solid #232838; font-size: 13px; }
    .summary-row:last-child { border-bottom: none; }
    .hide { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <div id="screen-start">
      <div class="tag">Интерактивный тест · 20 вопросов</div>
      <h1>Кинематограф России: <span>от немого кино до мирового признания</span></h1>
      <p class="desc">Проверьте свои знания по истории отечественного кино — от первого сеанса 1896 года и советского авангарда до премий «Оскар», Канн и современных фильмов.</p>
      <button type="button" class="btn" id="start-btn">Начать квиз</button>
    </div>

    <div id="screen-quiz" class="hide">
      <div class="top-bar">
        <span id="q-count">Вопрос 1 из 20</span>
        <span>Счёт: <strong id="q-score">0</strong></span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="q-bar"></div></div>
      <div class="q-era" id="q-era"></div>
      <div class="q-title" id="q-title"></div>
      <div class="answers" id="q-answers"></div>
      <div class="note hide" id="q-note">
        <div class="note-title" id="q-note-title"></div>
        <div id="q-note-text"></div>
      </div>
      <button type="button" class="btn" id="next-btn" disabled>Следующий вопрос</button>
    </div>

    <div id="screen-end" class="hide">
      <div class="tag">Итоги квиза</div>
      <div class="score-big" id="end-score">0 / 20</div>
      <div class="rank-title" id="end-rank"></div>
      <p class="rank-desc" id="end-desc"></p>
      <div class="summary" id="end-list"></div>
      <button type="button" class="btn" id="restart-btn">Пройти заново</button>
    </div>
  </div>

  <script id="quiz-json" type="application/json">
